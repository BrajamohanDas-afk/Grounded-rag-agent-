services:
  api:
    build: .
    env_file: .env
    environment:
      GRAG_INDEX_DIR: /data/index
    volumes: ["index:/data/index", "hf-cache:/root/.cache/huggingface"]
    ports: ["8000:8000"]
  ui:
    build: .
    env_file: .env
    environment:
      GRAG_INDEX_DIR: /data/index
    volumes: ["index:/data/index", "hf-cache:/root/.cache/huggingface"]
    ports: ["8501:8501"]
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0"]
  # Uncomment to run a free local LLM; then set GRAG_LLM_PROVIDER=ollama and
  # OLLAMA_BASE_URL=http://ollama:11434 in .env, and run: docker compose exec ollama ollama pull llama3.1:8b
  # ollama:
  #   image: ollama/ollama
  #   volumes: ["ollama:/root/.ollama"]
  #   ports: ["11434:11434"]
volumes:
  index:
  hf-cache:
  # ollama:
