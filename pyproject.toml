[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-rag"
version = "1.0.0"
description = "Agentic RAG with verified citation grounding (LangChain + LangGraph)"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-classic>=1.0",
  "langchain-text-splitters>=1.0",
  "langgraph>=1.0",
  "langchain-chroma>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.0",
  "pypdf>=4.0",
  "beautifulsoup4>=4.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
ollama = ["langchain-ollama>=1.0"]
local = ["langchain-huggingface>=1.0", "sentence-transformers>=3.0"]   # local embeddings + reranker
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "httpx>=0.27"]
all = ["grounded-rag[anthropic,openai,ollama,local,ui,dev]"]

[project.scripts]
grag = "grounded_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-temp"
filterwarnings = ["ignore::DeprecationWarning"]
